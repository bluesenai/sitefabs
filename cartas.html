<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas ❤️</title>

    <link rel="stylesheet" href="cartas.css">
</head>
<body>

    <button class="voltar" onclick="history.back()">
        ← Voltar
    </button>

    <h1>💌 Todas as letras que tenho a você</h1>

    <div id="envelope">

        <div class="frente">
            💌
            <p>Clique para abrir</p>
        </div>

    </div>

    <div id="carta">

        <h2>Meu amor ❤️</h2>

        <p>
            Aqui você escreve sua carta.
            Pode ser uma mensagem grande,
            contando tudo o que sente por ela.
        </p>

        <p>
            Obrigado por todos os momentos,
            pelas risadas, pelas conversas
            e por fazer meus dias melhores.
        </p>

        <p class="assinatura">
            Com amor ❤️
        </p>

    </div>

    <script src="cartas.js"></script>

</body>
</html>
